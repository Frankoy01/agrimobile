<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Price Prediction – AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button class="lang-btn" onclick="setLanguage('tl')">🇵🇭 TL</button>
            <button class="lang-btn" onclick="setLanguage('hil')">🇵🇭 HIL</button>
        </div>
        <h2><span data-i18n="pricePrediction">AI Price Prediction</span></h2>
        <div id="priceDisplay" style="font-size: 48px; font-weight: 700; color: #2e7d32; text-align: center; margin: 20px 0;">₱-- - ₱--</div>
        <div id="confidenceDisplay" style="text-align: center; margin: 10px 0;"></div>
        <div id="explanation" style="text-align: center; color: #555; margin: 20px 0;"></div>
        <div class="flex-between" style="justify-content: center; gap: 15px; margin-top: 20px;">
            <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
            <button id="acceptBtn" class="btn">Accept Price</button>
            <button onclick="history.back()" class="btn btn-secondary">← Back</button>
        </div>
    </div>
    <script type="module">
        import { setLanguage, t } from './js/translations.js';
        window.setLanguage = setLanguage;
        function generate() {
            const crops = ['Rice', 'Vegetables', 'Fruits'];
            const crop = crops[Math.floor(Math.random() * 3)];
            let base = crop === 'Rice' ? 40 : (crop === 'Vegetables' ? 60 : 80);
            const min = Math.floor(base + Math.random() * 15);
            const max = min + 5 + Math.floor(Math.random() * 10);
            const conf = Math.random();
            let level = conf > 0.7 ? 'high' : (conf > 0.4 ? 'medium' : 'low');
            let stars = level === 'high' ? '★★★★★' : (level === 'medium' ? '★★★☆☆' : '★☆☆☆☆');
            document.getElementById('priceDisplay').innerHTML = `₱${min} - ₱${max} / kg`;
            document.getElementById('confidenceDisplay').innerHTML = `${t('confidence')}: ${t(level)} ${stars}`;
            document.getElementById('explanation').innerHTML = `${t('cropType')}: ${crop}<br>Based on seasonal trends and market data.`;
        }
        document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
        generate();
        document.getElementById('refreshBtn').onclick = generate;
        document.getElementById('acceptBtn').onclick = () => alert('Price accepted! You can now list your product.');
    </script>
</body>
</html>
