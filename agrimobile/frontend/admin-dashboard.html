<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-large">
        <div class="flex-between">
            <h1>AgriMobile Admin Panel</h1>
            <button id="logoutBtn" class="btn btn-danger"> Logout</button>
        </div>
        <div id="stats" class="stats-grid" style="display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin: 20px 0;"></div>
        <div class="tab-buttons">
            <button class="btn" onclick="showTab('users')">👥 Users</button>
            <button class="btn" onclick="showTab('products')">Products</button>
            <button class="btn" onclick="showTab('orders')"> Orders</button>
        </div>
        <div id="usersPanel" class="panel"></div>
        <div id="productsPanel" class="panel" style="display:none"></div>
        <div id="ordersPanel" class="panel" style="display:none"></div>
    </div>
    <script type="module">
        import { adminFetch, adminDelete, adminUpdateRole, logout } from './js/api.js';
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'admin') window.location.href = 'admin-login.html';
        window.showTab = (tab) => {
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById(`${tab}Panel`).style.display = 'block';
        };
        async function loadStats() {
            const stats = await adminFetch('stats');
            document.getElementById('stats').innerHTML = `
                <div class="stat-card" style="background:#2e7d32; color:white; padding:20px; border-radius:20px; text-align:center;"><div class="number">${stats.total_users}</div><div>Users</div></div>
                <div class="stat-card" style="background:#2e7d32; color:white; padding:20px; border-radius:20px; text-align:center;"><div class="number">${stats.total_products}</div><div>Products</div></div>
                <div class="stat-card" style="background:#2e7d32; color:white; padding:20px; border-radius:20px; text-align:center;"><div class="number">${stats.total_orders}</div><div>Orders</div></div>
                <div class="stat-card" style="background:#2e7d32; color:white; padding:20px; border-radius:20px; text-align:center;"><div class="number">${stats.total_sold}</div><div>Units Sold (kg)</div></div>
            `;
        }
        async function loadUsers() {
            const users = await adminFetch('users');
            document.getElementById('usersPanel').innerHTML = `<h3>👥 Users</h3><table border="1" cellpadding="8"><tr><th>ID</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>${
                users.map(u => `<tr><td>${u.id}</td><td>${escapeHtml(u.email)}</td><td>${u.role}</td><td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td><button onclick="deleteUser(${u.id})">Delete</button> <select onchange="updateRole(${u.id}, this.value)"><option ${u.role==='farmer'?'selected':''}>farmer</option><option ${u.role==='buyer'?'selected':''}>buyer</option><option ${u.role==='admin'?'selected':''}>admin</option></select></td></tr>`
                ).join('')
            }</tr>`;
        }
        async function loadProducts() {
            const products = await adminFetch('products');
            document.getElementById('productsPanel').innerHTML = `<h3>🌾 Products</h3><table border="1" cellpadding="8"><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Farmer</th><th>Action</th></tr>${
                products.map(p => `<tr><td>${p.id}</td><td>${escapeHtml(p.name)}</td><td>₱${p.price}</td><td>${p.quantity}</td><td>${p.farmer_email || 'N/A'}</td><td><button onclick="deleteProduct(${p.id})">Delete</button></td></tr>`
                ).join('')
            }</tr>`;
        }
        async function loadOrders() {
            const orders = await adminFetch('orders');
            document.getElementById('ordersPanel').innerHTML = `<h3> Orders</h3><table border="1" cellpadding="8"><tr><th>ID</th><th>Product</th><th>Qty</th><th>Buyer</th><th>Farmer</th><th>Date</th></tr>${
                orders.map(o => `<tr><td>${o.id}</td><td>${escapeHtml(o.product_name)}</td><td>${o.quantity}</td><td>${o.buyer_email}</td><td>${o.farmer_email}</td><td>${new Date(o.order_date).toLocaleString()}</td></tr>`
                ).join('')
            }</table>`;
        }
        window.deleteUser = async (id) => { if(confirm('Delete user?')) { await adminDelete('users', id); loadUsers(); loadStats(); } };
        window.updateRole = async (id, role) => { await adminUpdateRole(id, role); loadUsers(); };
        window.deleteProduct = async (id) => { if(confirm('Delete product?')) { await adminDelete('products', id); loadProducts(); loadStats(); } };
        document.getElementById('logoutBtn').onclick = logout;
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }
        loadStats(); loadUsers(); loadProducts(); loadOrders();
    </script>
</body>
</html>
