<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard – AgriMobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f5f9f5 0%, #e8f5e9 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e8f5e9;
        }
        h1 { color: #2e7d32; font-size: 28px; }
        .logout-btn {
            background: #d32f2f;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .logout-btn:hover { background: #b71c1c; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            color: white;
        }
        .stat-number { font-size: 36px; font-weight: 700; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #f0f0f0;
            color: #333;
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .tab-btn.active { background: #2e7d32; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .table-wrapper { overflow-x: auto; border-radius: 20px; border: 1px solid #e8f5e9; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 600px; }
        th { background: #2e7d32; color: white; padding: 14px 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e8f5e9; }
        tr:hover td { background: #f5f9f5; }
        .role-select {
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid #c8e6c9;
            background: white;
            cursor: pointer;
        }
        .delete-btn {
            background: #d32f2f;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .delete-btn:hover { background: #b71c1c; }
        .empty-message { text-align: center; padding: 40px; color: #666; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-farmer { background: #e8f5e9; color: #2e7d32; }
        .badge-buyer { background: #e3f2fd; color: #2196f3; }
        .badge-admin { background: #fff3e0; color: #ff9800; }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AgriMobile Admin Panel</h1>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalUsers">0</div><div class="stat-label">Total Users</div></div>
            <div class="stat-card"><div class="stat-number" id="totalProducts">0</div><div class="stat-label">Total Products</div></div>
            <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Total Orders</div></div>
            <div class="stat-card"><div class="stat-number" id="totalSold">0</div><div class="stat-label">Units Sold (kg)</div></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="users">Users</button>
            <button class="tab-btn" data-tab="products">Products</button>
            <button class="tab-btn" data-tab="orders">Orders</button>
        </div>

        <div id="usersPanel" class="panel active">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" class="empty-message">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="productsPanel" class="panel">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Product Name</th><th>Price</th><th>Stock</th><th>Farmer</th><th>Action</th></tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr><td colspan="6" class="empty-message">No products added yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="ordersPanel" class="panel">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Product</th><th>Quantity</th><th>Buyer</th><th>Farmer</th><th>Date</th></tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="6" class="empty-message">No orders placed yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost/agrimobile/backend';

        async function fetchJSON(url) {
            const response = await fetch(url, { credentials: 'include' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }

        async function postJSON(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(data)
            });
            return response.json();
        }

        async function handleLogout() {
            await fetch(API_BASE + '/logout.php', { method: 'POST', credentials: 'include' });
            localStorage.removeItem('user');
            window.location.href = 'admin-login.html';
        }

        async function loadStats() {
            try {
                const stats = await fetchJSON(API_BASE + '/admin_get_stats.php');
                document.getElementById('totalUsers').innerText = stats.total_users || 0;
                document.getElementById('totalProducts').innerText = stats.total_products || 0;
                document.getElementById('totalOrders').innerText = stats.total_orders || 0;
                document.getElementById('totalSold').innerText = stats.total_sold || 0;
            } catch(e) { console.error('Stats error:', e); }
        }

        async function loadUsers() {
            try {
                const users = await fetchJSON(API_BASE + '/admin_get_users.php');
                const tbody = document.getElementById('usersTableBody');
                if (!users || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-message">No users found.</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${escapeHtml(u.email)}</td>
                        <td><span class="badge badge-${u.role}">${u.role}</span></td>
                        <td>${new Date(u.created_at).toLocaleDateString()}</td>
                        <td>
                            <select class="role-select" data-id="${u.id}">
                                <option value="farmer" ${u.role === 'farmer' ? 'selected' : ''}>Farmer</option>
                                <option value="buyer" ${u.role === 'buyer' ? 'selected' : ''}>Buyer</option>
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                            <button class="delete-btn" data-id="${u.id}" data-type="user">Delete</button>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.role-select').forEach(select => {
                    select.addEventListener('change', () => updateRole(select.dataset.id, select.value));
                });
                document.querySelectorAll('.delete-btn[data-type="user"]').forEach(btn => {
                    btn.addEventListener('click', () => deleteUser(btn.dataset.id));
                });
            } catch(e) { 
                console.error('Users error:', e);
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" class="empty-message">Error loading users.</td></tr>';
            }
        }

        async function loadProducts() {
            try {
                const products = await fetchJSON(API_BASE + '/admin_get_products.php');
                const tbody = document.getElementById('productsTableBody');
                if (!products || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-message">No products added yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td>${escapeHtml(p.name)}</td>
                        <td>₱${parseFloat(p.price).toFixed(2)}</td>
                        <td>${p.quantity} kg</td>
                        <td>${escapeHtml(p.farmer_email || 'N/A')}</td>
                        <td><button class="delete-btn" data-id="${p.id}" data-type="product">Delete</button></td>
                    </tr>
                `).join('');

                document.querySelectorAll('.delete-btn[data-type="product"]').forEach(btn => {
                    btn.addEventListener('click', () => deleteProduct(btn.dataset.id));
                });
            } catch(e) { console.error('Products error:', e); }
        }

        async function loadOrders() {
            try {
                const orders = await fetchJSON(API_BASE + '/admin_get_orders.php');
                const tbody = document.getElementById('ordersTableBody');
                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-message">No orders placed yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td>${o.id}</td>
                        <td>${escapeHtml(o.product_name)}</td>
                        <td>${o.quantity} kg</td>
                        <td>${escapeHtml(o.buyer_email)}</td>
                        <td>${escapeHtml(o.farmer_email)}</td>
                        <td>${new Date(o.order_date).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } catch(e) { console.error('Orders error:', e); }
        }

        async function updateRole(userId, newRole) {
            if (confirm('Change user role to ' + newRole + '?')) {
                try {
                    await postJSON(API_BASE + '/admin_update_role.php', { id: userId, role: newRole });
                    alert('Role updated successfully!');
                    loadUsers();
                    loadStats();
                } catch(e) { alert('Error: ' + e.message); }
            }
        }

        async function deleteUser(userId) {
            if (confirm('Delete this user? This cannot be undone.')) {
                try {
                    await postJSON(API_BASE + '/admin_delete_user.php', { id: userId });
                    alert('User deleted successfully!');
                    loadUsers();
                    loadStats();
                } catch(e) { alert('Error: ' + e.message); }
            }
        }

        async function deleteProduct(productId) {
            if (confirm('Delete this product?')) {
                try {
                    await postJSON(API_BASE + '/admin_delete_product.php', { id: productId });
                    alert('Product deleted successfully!');
                    loadProducts();
                    loadStats();
                } catch(e) { alert('Error: ' + e.message); }
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(tabId + 'Panel').classList.add('active');
                if (tabId === 'users') loadUsers();
                else if (tabId === 'products') loadProducts();
                else if (tabId === 'orders') loadOrders();
            });
        });

        const storedUser = localStorage.getItem('user');
        if (!storedUser) { window.location.href = 'admin-login.html'; }
        const user = JSON.parse(storedUser);
        if (user.role !== 'admin') { window.location.href = 'admin-login.html'; }

        loadStats();
        loadUsers();
        document.getElementById('logoutBtn').onclick = handleLogout;
    </script>
</body>
</html>
