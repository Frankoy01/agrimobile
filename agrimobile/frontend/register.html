<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button class="lang-btn" onclick="setLanguage('tl')">🇵🇭 TL</button>
            <button class="lang-btn" onclick="setLanguage('hil')">🇵🇭 HIL</button>
        </div>
        <h2 data-i18n="register">Register</h2>
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="username" data-i18n="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" data-i18n="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" data-i18n="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" data-i18n="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <div class="form-group">
                <textarea id="address" data-i18n="address" placeholder="Your Address (Farm/Business Location)" rows="2"></textarea>
            </div>
            <div class="radio-group">
                <label><input type="radio" name="role" value="farmer" checked> <span data-i18n="farmer">Farmer</span></label>
                <label><input type="radio" name="role" value="buyer"> <span data-i18n="buyer">Buyer</span></label>
            </div>
            <button type="submit" class="btn" data-i18n="register">Register</button>
        </form>
        <p class="mt-2"><a href="login.html" data-i18n="haveAccount">Already have an account? Login</a></p>
    </div>
    <script type="module">
        import { register } from './js/api.js';
        import { setLanguage, t } from './js/translations.js';
        window.setLanguage = setLanguage;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            if (el.placeholder) el.placeholder = t(el.getAttribute('data-i18n'));
            else el.textContent = t(el.getAttribute('data-i18n'));
        });
        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const address = document.getElementById('address').value;
            if (password !== confirm) { alert('Passwords do not match'); return; }
            const role = document.querySelector('input[name="role"]:checked').value;
            try {
                await register(email, password, role, username, address);
                window.location.href = role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html';
            } catch(err) { alert('Registration failed: ' + err.message); }
        });
    </script>
</body>
</html>
