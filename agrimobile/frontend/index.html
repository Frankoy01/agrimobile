<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button class="lang-btn" onclick="setLanguage('tl')">🇵🇭 TL</button>
            <button class="lang-btn" onclick="setLanguage('hil')">🇵🇭 HIL</button>
        </div>
        <h1 data-i18n="welcome"> AgriMobile</h1>
        <p style="text-align:center; margin-bottom:20px;">Empowering Filipino Farmers through Digital Commerce</p>
        <div class="button-group">
            <a href="login.html" class="btn" data-i18n="login">Login</a>
            <a href="register.html" class="btn btn-secondary" data-i18n="register">Register</a>
        </div>
        <div class="info-box" style="background:#e8f5e9; padding:15px; border-radius:20px; margin-top:20px; text-align:center;">
             Voice Navigation • Hiligaynon/Tagalog/English • Offline Drafts • AI Price Recommendations
        </div>
    </div>
    <script type="module">
        import { setLanguage, t } from './js/translations.js';
        window.setLanguage = setLanguage;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.getAttribute('data-i18n'));
        });
    </script>
</body>
</html>
