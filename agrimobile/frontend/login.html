<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button class="lang-btn" onclick="setLanguage('tl')">🇵🇭 TL</button>
            <button class="lang-btn" onclick="setLanguage('hil')">🇵🇭 HIL</button>
        </div>
        <h2 data-i18n="welcome">Welcome</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="email" data-i18n="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" data-i18n="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" data-i18n="login">Login</button>
        </form>
        <p class="mt-2"><a href="register.html" data-i18n="noAccount">No account? Register</a></p>
    </div>
    <script type="module">
        import { login } from './js/api.js';
        import { setLanguage, t } from './js/translations.js';
        window.setLanguage = setLanguage;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            if (el.placeholder) el.placeholder = t(el.getAttribute('data-i18n'));
            else el.textContent = t(el.getAttribute('data-i18n'));
        });
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const data = await login(email, password);
                const role = data.user.role;
                if (role === 'farmer') window.location.href = 'farmer-dashboard.html';
                else if (role === 'admin') window.location.href = 'admin-dashboard.html';
                else window.location.href = 'buyer-dashboard.html';
            } catch(err) { alert('Login failed: ' + err.message); }
        });
    </script>
</body>
</html>
