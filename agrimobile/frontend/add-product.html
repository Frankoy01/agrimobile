<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product – AgriMobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button class="lang-btn" onclick="setLanguage('tl')">🇵🇭 TL</button>
            <button class="lang-btn" onclick="setLanguage('hil')">🇵🇭 HIL</button>
        </div>
        <h2 data-i18n="addProduct">Add New Product</h2>
        <form id="productForm" enctype="multipart/form-data">
            <div class="form-group">
                <input type="text" name="name" data-i18n="productName" placeholder="Product Name" required>
            </div>
            <div class="form-group">
                <textarea name="description" data-i18n="description" placeholder="Description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <select name="category">
                    <option value="rice">Rice</option>
                    <option value="vegetables"> Vegetables</option>
                    <option value="fruits">Fruits</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" name="origin" data-i18n="origin" placeholder="Origin (Province)">
            </div>
            <div class="form-group">
                <input type="number" step="0.01" name="price" data-i18n="price" placeholder="Price (₱/kg)" required>
            </div>
            <div class="form-group">
                <input type="number" step="1" name="quantity" data-i18n="quantity" placeholder="Quantity (kg)" required>
            </div>
            <div class="form-group">
                <label data-i18n="productImage">Product Image</label>
                <input type="file" name="image" accept="image/*" id="imageInput">
                <img id="imagePreview" style="display: none; width: 100px; margin-top: 10px; border-radius: 12px;">
            </div>
            <div class="flex-between">
                <button type="submit" class="btn" data-i18n="submit">Submit</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">← <span data-i18n="back">Back</span></button>
            </div>
        </form>
    </div>
    <script type="module">
        import { addProduct, getUser } from './js/api.js';
        import { setLanguage, t } from './js/translations.js';
        window.setLanguage = setLanguage;
        const user = getUser();
        if (!user || user.role !== 'farmer') location.href = 'login.html';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            if (el.placeholder) el.placeholder = t(el.getAttribute('data-i18n'));
            else if (el.tagName === 'LABEL') el.textContent = t(el.getAttribute('data-i18n'));
            else el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            if (e.target.files[0]) {
                preview.src = URL.createObjectURL(e.target.files[0]);
                preview.style.display = 'block';
            } else preview.style.display = 'none';
        });
        const form = document.getElementById('productForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            try {
                await addProduct(formData);
                alert('✅ Product added successfully!');
                location.href = 'farmer-dashboard.html';
            } catch(err) { alert('❌ Error: ' + err.message); }
        });
    </script>
</body>
</html>
